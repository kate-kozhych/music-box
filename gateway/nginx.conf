# Innotter gateway (architecture.md §4.1). Single origin on :8080 (host) -> :80.

# Accept a client X-Request-ID or generate one (NFR-072).
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # Docker's DNS: upstreams are resolved per request, so the gateway starts
    # (and keeps serving the rest) even if one service is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity     http://identity:8000;
    set $core         http://core-api:8000;
    set $notification http://notification:8000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Request-ID      $req_id;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Internal only (ADR-0005): never exposed through the gateway.
    location = /.well-known/jwks.json { return 404; }

    # --- Identity -----------------------------------------------------------
    location /api/v1/auth/            { proxy_pass $identity; }
    location = /api/v1/account        { proxy_pass $identity; }
    location = /api/v1/account/avatar { client_max_body_size 2m; proxy_pass $identity; }
    location /api/v1/account/         { proxy_pass $identity; }
    location /api/v1/admin/users      { proxy_pass $identity; }

    # --- Notification -------------------------------------------------------
    location /api/v1/notifications    { proxy_pass $notification; }

    # --- Core (everything else under /api/v1) -------------------------------
    location /api/v1/                 { proxy_pass $core; }

    # --- Avatars (read-only volume shared with Identity) --------------------
    location /media/avatars/ {
        alias /srv/avatars/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        expires 1h;
    }

    # --- SPA ------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # add_header here replaces the server-level ones, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://coverartarchive.org https://*.archive.org; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    }
}
