# Shared Ruff configuration for every Python project in the monorepo
# (packages/innotter-common and services/*). Service pyproject.toml files
# deliberately have no [tool.ruff] table, so Ruff walks up to this file and
# all services are linted and formatted identically (architecture.md R6).

target-version = "py313"
line-length = 100
src = ["packages/*/src", "services/*/src", "services/*/tests", "packages/*/tests"]
extend-exclude = [
    "**/migrations/**",          # generated by Alembic / Django
    "services/core/manage.py",   # framework-generated entry point
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # shadowed builtins
    "C4",       # comprehensions
    "DTZ",      # naive datetimes (UTC everywhere, DR-71)
    "T20",      # print() is not logging (NFR-071, LR-29)
    "S",        # bandit subset (security)
    "SIM",      # simplifications
    "RET",      # return statements
    "PT",       # pytest style
    "PTH",      # pathlib
    "TID",      # tidy imports
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # line length is handled by the formatter
    "B008",     # FastAPI Depends()/Query() in defaults is the framework idiom
    "RET504",   # "unnecessary assignment before return" hurts readability in handlers
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.isort]
known-first-party = ["innotter_common", "identity", "innotter_core", "notifier"]

[format]
quote-style = "double"
docstring-code-format = true

[lint.flake8-builtins]
# Compare full module paths, so innotter_common.logging / apps.platform are not
# reported as shadowing the stdlib (they are only ever imported absolutely).
strict-checking = false
