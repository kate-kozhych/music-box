[project]
name = "musicbox-core"
version = "0.1.0"
description = "Musicbox 2.0 Core Service: music catalog, ratings, reviews, diary, posts, interactions, follows, feed, moderation."
requires-python = ">=3.13,<3.14"
dependencies = [
    "musicbox-common[django]",
    "django>=5.2,<5.3",                # LTS until April 2028
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28",
    "pydantic-settings>=2.9,<3",       # typed, fail-fast settings (same tool as the FastAPI services)
    "mysqlclient>=2.2,<3",
    "celery[redis]>=5.5,<6",
    "redis>=5.2,<7",
    "httpx>=0.28,<0.29",               # MusicBrainz adapter, JWKS
    "pika>=1.3,<2",                    # identity-events consumer (management command)
    "gunicorn>=23.0,<24",
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "musicbox_core", from = "src" }]

[tool.poetry.dependencies]
musicbox-common = { path = "../../packages/musicbox-common", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-django = "^4.10"
pytest-cov = "^6.0"
respx = ">=0.22"
factory-boy = "^3.3"
ruff = ">=0.11"
mypy = "^1.15"
django-stubs = { version = ">=5.2,<5.3", extras = ["compatible-mypy"] }
djangorestframework-stubs = ">=3.16,<3.17"
celery-types = ">=0.23"
import-linter = ">=2.1,<3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "musicbox_core.config.settings.test"
markers = [
    "integration: needs real MySQL/Redis/RabbitMQ (Compose test services)",
    "api: HTTP-level tests through DRF",
    "contracts: event contract tests (B-48)",
]

[tool.coverage.run]
source = ["musicbox_core"]
branch = true
omit = ["*/migrations/*"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["musicbox_core"]
# Django writes the migration files; `makemigrations --check` is what guards
# them (B-03 drift job), not the type checker.
exclude = ["/migrations/"]

plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "musicbox_core.config.settings.typecheck"

[[tool.mypy.overrides]]
module = ["pika", "pika.*"]
# pika ships no stubs and no py.typed marker; follow it untyped rather than
# scattering per-import ignores across the messaging modules.
follow_untyped_imports = true
