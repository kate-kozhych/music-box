[project]
name = "innotter-notification"
version = "0.1.0"
description = "Innotter 2.0 Notification Service: in-app notifications from RabbitMQ events, user snapshots."
requires-python = ">=3.13,<3.14"
dependencies = [
    "innotter-common[fastapi]",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0,<24",
    "pymongo>=4.13,<5",          # PyMongo Async API (Motor is deprecated)
    "aio-pika>=9.5,<10",
    "redis>=5.2,<7",
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "notifier", from = "src" }]

[tool.poetry.dependencies]
innotter-common = { path = "../../packages/innotter-common", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = ">=0.25"
pytest-cov = "^6.0"
httpx = ">=0.28,<0.29"
respx = ">=0.22"
ruff = ">=0.11"
mypy = "^1.15"
import-linter = ">=2.1,<3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real MongoDB/Redis/RabbitMQ (Compose test services)",
    "api: HTTP-level tests through the FastAPI app",
]

[tool.coverage.run]
source = ["notifier"]
branch = true

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["notifier"]
plugins = ["pydantic.mypy"]
