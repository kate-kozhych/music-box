[project]
name = "innotter-identity"
version = "0.1.0"
description = "Innotter 2.0 Identity Service: accounts, sessions (EdDSA JWT + JWKS), avatars, user administration."
requires-python = ">=3.13,<3.14"
dependencies = [
    "innotter-common[fastapi]",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.20",       # avatar uploads
    "uvicorn[standard]>=0.34",
    "gunicorn>=23.0,<24",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.15,<2",
    "argon2-cffi>=23.1",             # Argon2id (NFR-030)
    "pyjwt[crypto]>=2.10,<3",        # EdDSA signing (ADR-0005)
    "redis>=5.2,<7",
    "aio-pika>=9.5,<10",
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "identity", from = "src" }]

[tool.poetry.dependencies]
innotter-common = { path = "../../packages/innotter-common", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = ">=0.25"
pytest-cov = "^6.0"
httpx = ">=0.28,<0.29"
respx = ">=0.22"
factory-boy = "^3.3"
ruff = ">=0.11"
mypy = "^1.15"
import-linter = ">=2.1,<3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real PostgreSQL/Redis/RabbitMQ (Compose test services)",
    "api: HTTP-level tests through the FastAPI app",
]

[tool.coverage.run]
source = ["identity"]
branch = true
omit = ["*/migrations/*"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["identity"]
plugins = ["pydantic.mypy"]
